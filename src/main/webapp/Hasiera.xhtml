<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
 "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Market JSF - Hasiera</title>
</h:head>
<h:body>
    <h2>Ongi etorri Merkatura</h2>
    <p>Aukeratu zer egin nahi duzun:</p>

    <h:form>
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel value="Posta elektronikoa:" for="email" />
            <h:inputText id="email" value="#{loginBean.email}" required="true"
                         requiredMessage="Posta elektronikoa derrigorrezkoa da." />

            <h:outputLabel value="Pasahitza:" for="pass" />
            <h:inputSecret id="pass" value="#{loginBean.password}" required="true"
                           requiredMessage="Pasahitza derrigorrezkoa da." />
        </h:panelGrid>

        <br />
        <h:commandButton value="Saioa hasi" action="#{loginBean.sartu}" />
        &nbsp;
        <h:commandButton value="Erregistratu" action="Erregistratu?faces-redirect=true" immediate="true" />

        <br /><br />
        <h:messages infoStyle="color:green;" errorStyle="color:red;" />
    </h:form>
</h:body>
</html>
